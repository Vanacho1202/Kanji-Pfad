p{margin:0}
.sub{color:var(--mute)}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}

.bar.thin{height:5px}.bar.thin i{background:var(--k)}
.row{display:flex;gap:12px}

.sm{flex:0 0 auto;padding:8px 14px;font-size:.9rem;border-radius:12px}

.danger{color:var(--bad)}

.sync.cloud::before{background:var(--ok)}
.code{font-size:1.6rem;font-weight:900;letter-spacing:.08em;margin:0;font-variant-numeric:tabular-nums;color:var(--k);user-select:all}.sync.error::before{background:var(--bad)}.sync.loading::before{background:var(--k)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

.grid.k5 .t span{font-size:1.4rem}

.lv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px}

.tag.r{background:var(--tg)}
.hint{color:var(--mute);text-align:left}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left}.dl dt{color:var(--mute)}.dl dd{margin:0;min-width:0}

input{text-align:center}

.ov[hidden]{display:none}

.rd{display:flex;flex-direction:column;gap:6px;text-align:left}

.rin.ok{border-color:var(--ok)}.rin.bad{border-color:var(--bad)}

.neon::before{content:"";width:8px;height:8px;border-radius:50%;background:#9ffcff;box-shadow:0 0 6px #22e5ff,0 0 12px #22e5ff}
.neon.on{opacity:1;transform:none;animation:flick .7s}
.neon.cloud{color:#ffb3f6;border-color:#ff3df2;text-shadow:0 0 6px #ff3df2,0 0 14px #ff3df2;box-shadow:0 0 8px #ff3df2,0 0 24px rgba(255,61,242,.45),inset 0 0 10px rgba(255,61,242,.3)}
.neon.cloud::before{background:#ffb3f6;box-shadow:0 0 6px #ff3df2,0 0 12px #ff3df2}
@keyframes flick{0%{opacity:.15}10%{opacity:1}18%{opacity:.35}26%,100%{opacity:1}}
.mean{font-size:2.2rem;font-weight:900;line-height:1.2;margin:0;padding:28px 0;color:var(--k);text-wrap:balance;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.opt:disabled{opacity:1;cursor:default}.opt.ok{border-color:var(--ok);background:var(--tg)}.opt.bad{border-color:var(--bad)}

.resume span{font-size:.85rem;color:#9ffcff}
.resume button{padding:10px 16px;border-radius:12px}

.resume .ghost{flex:0 0 auto;background:#1b1f45;color:#eceefc}
@keyframes nope{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

@media (min-width:600px){.ov{align-items:center}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const dist=(a,b)=>{if(a==b)return 0;if(Math.abs(a.length-b.length)>1)return 2;if(a.length==b.length){const x=[];for(let i=0;i<a.length;i++)if(a[i]!=b[i])x.push(i);if(x.length==1)return 1;if(x.length==2&&x[1]==x[0]+1&&a[x[0]]==b[x[1]]&&a[x[1]]==b[x[0]])return 1;return 2}const [s,l]=a.length<b.length?[a,b]:[b,a];let i=0;while(i<s.length&&s[i]==l[i])i++;return s.slice(i)==l.slice(i+1)?1:2};

/* Romaji während der Eingabe in Hiragana umwandeln; unfertige Silben bleiben stehen */
function liveKana(s,final){
 s=s.replace(/ā/g,'aa').replace(/ī/g,'ii').replace(/ū/g,'uu').replace(/ē/g,'ee').replace(/ō/g,'ou');
 let o='',i=0;
 while(i<s.length){
  const c=s[i],n=s[i+1];
  if(!/[a-z]/.test(c)){if(c!=="'")o+=c;i++;continue}
  if(c==='n'){
   if(n===undefined){o+=final?'ん':'n';i++;continue}
   if(n==="'"||(n==='n'&&final&&s[i+2]===undefined)){o+='ん';i+=2;continue}
   if(!'aiueoy'.includes(n)){o+='ん';i++;continue}
  }
  if(n&&c===n&&/[bcdfghjkmpqrstwz]/.test(c)){o+='っ';i++;continue}
  const t=[3,2,1].map(l=>s.substr(i,l)).find(x=>T[x]);
  if(t){o+=T[t];i+=t.length;continue}
  const rest=s.slice(i);
  if(!final&&TK.some(k=>k.startsWith(rest))){o+=rest;break}
  o+=c;i++;
 }
 return o;
}

/* Online-Speicherung über eigenen Server: jeder Stand liegt unter einem Sync-Code */
const API="/api/p/";
const ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode=()=>{const a=new Uint8Array(10);crypto.getRandomValues(a);const s=[...a].map(x=>ALPH[x%ALPH.length]).join("");return s.slice(0,5)+"-"+s.slice(5)};
const normCode=s=>{const t=String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");return t.length==10?t.slice(0,5)+"-"+t.slice(5):""};
const readCookie=()=>{const m=document.cookie.match(/(?:^|; )kp_code=([^;]+)/);return m?decodeURIComponent(m[1]):""};
function getCode(){let c="";try{c=localStorage.getItem("kp_code")||""}catch(e){}c=normCode(c)||normCode(readCookie());return c}
function setCode(c){try{localStorage.setItem("kp_code",c)}catch(e){}try{document.cookie="kp_code="+encodeURIComponent(c)+";max-age=34560000;path=/;SameSite=Lax"}catch(e){}}
let CODE=getCode();
if(!CODE){CODE=newCode();setCode(CODE)}else setCode(CODE);
let online=true,syncState="loading",timer=0,writing=false,again=false;
function push(){clearTimeout(timer);timer=setTimeout(flush,700)}
function flushNow(keep){clearTimeout(timer);flush(keep)}
async function flush(keep){
 if(writing){again=true;return}
 writing=true;
 try{
  const r=await fetch(API+CODE,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({data:JSON.stringify(ST),upd:ST.upd}),keepalive:!!keep});
  if(!r.ok)throw new Error(r.status);
  syncState="cloud";flashSaved("Online gesichert",true);
 }catch(e){syncState="error"}
 writing=false;paintSync();
 if(again){again=false;flush()}
}

 if(!r.ok)throw new Error(r.status);

/* ---------- Abfrage ---------- */
const LOOK=["人入八","日目田白百","木本林森","大犬天夫","左右石","見貝目","千十午","玉王土","母毎女","四西口","小少","子字学","前後","今分会"].map(g=>[...g]);
function optionsFor(d){
 const bad=new Set(d.m),good=x=>x&&x.k!=d.k&&!x.m.some(m=>bad.has(m));
 const near=[];
 LOOK.forEach(g=>{if(g.includes(d.k))g.forEach(k=>{const x=DK[k];if(good(x))near.push(x)})});
 const rest=shuffle(D.filter(x=>good(x)&&!near.includes(x)&&(ST.k[x.k]||x.l<=d.l)));
 return shuffle([d,...shuffle(near).concat(rest).slice(0,3)]);
}
function review(o,R){
 view="review";
 let Q,W,C,total,done;
 if(R){Q=(R.Q||[]).filter(q=>DK[q[0]]).map(q=>[DK[q[0]],q[1]]);W=R.W||{};C=R.C||{};total=R.total||Q.length;done=R.done||0}
 else{const items=o.items||(o.free?D.filter(d=>ST.k[d.k]):due());Q=[];items.forEach(d=>Q.push([d,"m"],[d,"r"],[d,"w"]));shuffle(Q);W={};C={};total=Q.length;done=0}
 const keep=()=>{ST.sess=Q.length?{kind:"review",o:{free:!!o.free,after:o.after||0},Q:Q.map(q=>[q[0].k,q[1]]),W,C,total,done}:null};
 const TAG={m:"Bedeutung",r:"Lesungen",w:"Welches Kanji?"};
 const ask=()=>{
  if(!Q.length){ST.sess=null;save();return o.after?finished(o.after):home()}
  const [d,t]=Q[0];let checked=false,ok=false;scrollTo(0,0);
  const head=t=="w"?`<p class="mean">${d.m.slice(0,2).map(cap).join(" / ")}</p>`:`<div class="kanji">${d.k}</div>`;
  const body=t=="m"
   ?`<input id="a" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" lang="de" placeholder="auf Deutsch" aria-label="Bedeutung auf Deutsch">`
   :t=="r"
   ?`<p class="tiny">Schreibe jede Form in das passende Feld. Romaji wird beim Tippen zu Hiragana.</p>${fieldsHtml(d)}`
   :`<div class="opts">${optionsFor(d).map(x=>`<button class="opt" data-k="${x.k}" aria-label="${x.k}">${x.k}</button>`).join("")}</div>`;
  $.innerHTML=`<div class="qhead"><button class="ghost sm" id="x">Beenden</button><span class="sub">${done} von ${total}${o.free?" · ohne Wertung":""}</span></div>
  <div class="bar thin"><i style="width:${done/total*100}%"></i></div>
  <div class="card" id="c">${head}<span class="tag ${t=="r"?"r":""}">${TAG[t]}</span>${body}<div id="f" role="status"></div></div>
  <div class="row"><button class="ghost" id="skip">Weiß ich nicht</button><button class="ghost" id="fix" hidden>Ich lag richtig</button><button class="big1" id="go">Prüfen</button></div>`;
  const c=el("c"),f=el("f"),go=el("go"),fix=el("fix"),skip=el("skip"),ins=[...c.querySelectorAll("input")],opts=[...c.querySelectorAll(".opt")];
  if(ins[0])ins[0].focus();
  const shake=()=>{c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");(ins.find(x=>!x.value.trim())||ins[0]).focus()};
  const finish=sayText=>{
   ins.forEach(x=>x.readOnly=true);
   c.classList.add(ok?"ok":"bad");checked=true;logAns();ok?sfx.ok():sfx.bad();say(sayText);
   go.disabled=false;go.textContent="Weiter";fix.hidden=ok;skip.hidden=true;go.focus();
  };
  const check=force=>{
   if(!force&&ins.every(x=>!x.value.trim()))return shake();
   if(t=="m"){
    ok=okM(d,ins[0].value);
    f.textContent=ok?"Richtig!":"Richtig wäre: "+d.m.join(" / ");
    finish(d.r);
   }else{
    ok=true;
    ins.forEach(x=>{
     const i=+x.dataset.i,forms=RD[d.k][i][1].split("/"),v=normR(x.value),good=forms.includes(v),r=el("x"+i);
     if(!good)ok=false;
     if(v)x.value=v;
     x.classList.add(good?"ok":"bad");
     r.className="res "+(good?"ok":"bad");
     r.textContent=good?"Richtig":"Richtig wäre: "+forms.join(" / ");
    });
    f.textContent=ok?"Richtig!":"Nicht alle Felder stimmen.";
    finish(RD[d.k].map(r=>r[1].split("/")[0]).join("、"));
   }
  };
  const next=()=>{
   Q.shift();
   if(ok){done++;C[d.k]=(C[d.k]||0)+1;
    if(C[d.k]==3&&!o.free){const s=ST.k[d.k];s.st=W[d.k]?Math.max(1,s.st-1):Math.min(8,s.st+1);s.due=now()+INT[s.st]*36e5}
   }else{W[d.k]=1;Q.splice(Math.min(Q.length,3+Math.floor(Math.random()*3)),0,[d,t])}
   keep();save();ask();
  };
  if(t=="w"){
   go.disabled=true;skip.hidden=true;
   opts.forEach(b=>b.onclick=()=>{
    if(checked)return;
    ok=b.dataset.k==d.k;
    opts.forEach(x=>{x.disabled=true;if(x.dataset.k==d.k)x.classList.add("ok");else if(x===b)x.classList.add("bad")});
    f.textContent=ok?"Richtig!":"Richtig wäre: "+d.k+" ("+d.r+")";
    finish(d.r);
   });
  }
  ins.forEach((x,n)=>{
   if(t=="r"){const conv=()=>{const v=liveKana(x.value.toLowerCase(),false);if(v!==x.value)x.value=v};x.addEventListener("input",e=>{if(e.isComposing||(e.inputType&&!e.inputType.startsWith("insert")))return;conv()});x.addEventListener("compositionend",conv)}
   x.onkeydown=e=>{if(e.key!="Enter")return;e.preventDefault();if(checked)next();else if(n<ins.length-1)ins[n+1].focus();else check()};
  });
  go.onclick=()=>checked?next():check();
  skip.onclick=()=>check(true);
  fix.onclick=()=>{ok=true;c.classList.replace("bad","ok");f.textContent="Als richtig gewertet";next()};
  el("x").onclick=()=>{save();home()};
 };ask();
}

/* ---------- Sicherung ---------- */
const enc=s=>btoa(unescape(encodeURIComponent(s)));
const dec=s=>{s=s.trim();if(s.startsWith("{"))return s;try{return decodeURIComponent(escape(atob(s.replace(/\s+/g,""))))}catch(e){return""}};
function settings(){
 view="set";scrollTo(0,0);
 $.innerHTML=`<div class="qhead"><button class="ghost sm" id="x">Zurück</button></div>
 <h1>Sicherung</h1>
 <section class="panel"><h2>Speicherort</h2><p class="sync" id="sync"></p>
 <p class="sub">Jeder Schritt wird online auf dem Kanji-Pfad-Server gespeichert, auch in der App auf dem Home-Bildschirm. Zusätzlich liegt immer eine Kopie auf diesem Gerät.</p></section>
 <section class="panel"><h2>Dein Sync-Code</h2><p class="code" id="cd">${CODE}</p>
 <p class="sub">Mit diesem Code holst du deinen Stand auf ein anderes Gerät. Schreib ihn dir auf: Ohne ihn kommst du nach dem Löschen der App nicht mehr an deinen Fortschritt.</p>
 <button class="big1" id="cc">Code kopieren</button><p class="tiny" id="ccm" role="status"></p>
 <h2>Anderes Gerät verbinden</h2><p class="sub">Gib hier den Sync-Code von deinem anderen Gerät ein. Dein Stand auf diesem Gerät wird dann durch den Stand vom Code ersetzt.</p>
 <input id="nc" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXXX-XXXXX" aria-label="Sync-Code eingeben"><button class="ghost w" id="ncb">Verbinden</button><p class="tiny" id="ncm" role="status"></p></section>
 <section class="panel"><h2>Sicherungscode</h2><p class="sub">Kopiere den Code und bewahre ihn z. B. in einer Notiz auf. Damit kannst du deinen Fortschritt jederzeit wiederherstellen.</p>
 <textarea id="exp" readonly rows="4" aria-label="Sicherungscode"></textarea><button class="big1" id="cp">Code kopieren</button><p class="tiny" id="cpm" role="status"></p></section>
 <section class="panel"><h2>Sicherung einspielen</h2><textarea id="imp" rows="4" placeholder="Sicherungscode hier einfügen" aria-label="Sicherungscode einfügen"></textarea>
 <button class="ghost w" id="im">Einspielen</button><div id="imc" class="row" hidden></div><p class="tiny" id="imm" role="status"></p></section>
 <section class="panel"><h2>Neu anfangen</h2><p class="sub">Löscht deinen gesamten Kanji- und Kana-Fortschritt, auch im Konto.</p>
 <button class="ghost danger w" id="rs">Fortschritt zurücksetzen</button><div id="rsc" class="row" hidden></div></section>`;
 paintSync();
 const exp=el("exp");exp.value=enc(JSON.stringify(ST));
 el("x").onclick=home;
 el("cc").onclick=()=>{const m=el("ccm");try{navigator.clipboard.writeText(CODE).then(()=>m.textContent="Kopiert.",()=>m.textContent="Markiere den Code und kopiere ihn von Hand.")}catch(e){m.textContent="Markiere den Code und kopiere ihn von Hand."}};
 el("ncb").onclick=async()=>{const m=el("ncm"),c=normCode(el("nc").value);
  if(!c){m.textContent="Der Code hat 10 Zeichen, z. B. ABCDE-FGH23.";return}
  m.textContent="Wird geladen …";
  try{const r=await fetch(API+c,{cache:"no-store"});
   if(r.status==404){m.textContent="Zu diesem Code gibt es keinen gespeicherten Stand. Prüfe die Schreibweise.";return}
   if(!r.ok)throw 0;const j=await r.json(),p=parse(String(j.data||""));if(!p)throw 0;
   CODE=c;setCode(c);ST=p;fixDue();writeLocal();syncState="cloud";home();
  }catch(e){m.textContent="Server nicht erreichbar. Versuch es gleich noch einmal."}};
 el("cp").onclick=()=>{const m=el("cpm");try{navigator.clipboard.writeText(exp.value).then(()=>m.textContent="Kopiert.",()=>{exp.select();m.textContent="Der Code ist markiert. Kopiere ihn jetzt von Hand."})}catch(e){exp.select();m.textContent="Der Code ist markiert. Kopiere ihn jetzt von Hand."}};
 el("im").onclick=()=>{
  const p=parse(dec(el("imp").value)),m=el("imm"),box=el("imc");
  if(!p){m.textContent="Der Code ist ungültig. Kopiere ihn vollständig und füge ihn noch einmal ein.";box.hidden=true;return}
  m.textContent=`Gefunden: ${Object.keys(p.k).length} gelernte Kanji. Dein aktueller Stand wird ersetzt.`;
  box.innerHTML=`<button class="ghost" id="imn">Abbrechen</button><button class="big1" id="imy">Ja, ersetzen</button>`;box.hidden=false;
  el("imn").onclick=()=>{box.hidden=true;m.textContent=""};
  el("imy").onclick=()=>{ST=p;fixDue();save();home()};
 };
 el("rs").onclick=()=>{
  const box=el("rsc");
  box.innerHTML=`<button class="ghost" id="rsn">Abbrechen</button><button class="big1" id="rsy" style="background:var(--bad);color:var(--card)">Endgültig löschen</button>`;box.hidden=false;
  el("rsn").onclick=()=>box.hidden=true;
  el("rsy").onclick=()=>{ST=blank();save();home()};
 };
}

home();
initSync();
</script>

</body></html>
